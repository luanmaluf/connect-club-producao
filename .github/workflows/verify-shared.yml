name: Verify Shared Workspace
on:
  push:
    paths:
      - ".github/workflows/verify-shared.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public site
        shell: bash
        run: |
          sleep 5
          SITE="https://luanmaluf.github.io/connect-club-producao/"
          curl -fsS "$SITE" -o /tmp/site.html
          grep -q "shared-config.js" /tmp/site.html
          curl -fsS "${SITE}shared-config.js" -o /tmp/shared.js
          REMOTE=$(grep -oE 'https://superjsonblob.com/api/jsonBlob/[A-Za-z0-9-]+' /tmp/shared.js | head -1)
          test -n "$REMOTE"
          echo "REMOTE=$REMOTE" >> "$GITHUB_ENV"
          curl -fsS -H "Origin: https://luanmaluf.github.io" "$REMOTE" -o /tmp/data.json
          node -e "const d=require('/tmp/data.json'); if(d.settings.eventName!=='CONNECT CLUB'||d.expenses.length<100||d.tickets.length<3) process.exit(1); console.log('shared data ok',d.expenses.length)"

      - name: Verify browser PUT CORS
        shell: bash
        run: |
          curl -sS -D /tmp/headers.txt -o /dev/null -X OPTIONS "$REMOTE" \
            -H "Origin: https://luanmaluf.github.io" \
            -H "Access-Control-Request-Method: PUT" \
            -H "Access-Control-Request-Headers: content-type"
          cat /tmp/headers.txt
          grep -qi "access-control-allow-origin" /tmp/headers.txt
          grep -Eqi "access-control-allow-methods:.*PUT" /tmp/headers.txt
