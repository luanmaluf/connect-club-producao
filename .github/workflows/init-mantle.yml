name: Initialize MantleDB Workspace

on:
  push:
    paths:
      - ".github/workflows/init-mantle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize shared workspace
        shell: bash
        run: |
          if [ -f shared-config.js ] && grep -q "mantledb.sh/v2/" shared-config.js; then
            echo "Mantle workspace already configured."
            exit 0
          fi

          awk '/^let state=defaultState/{exit} {print}' app1.js > /tmp/seed-part.js
          cat >> /tmp/seed-part.js <<'NODE'
          const s = defaultState();
          s.activity = [{id:uid(),at:today(),by:"Sistema",action:"Workspace criado",detail:"Base compartilhada oficial do CONNECT CLUB criada automaticamente."}];
          console.log(JSON.stringify(s));
          NODE
          node /tmp/seed-part.js > /tmp/state.json

          python - <<'PY'
          import gzip, base64, json
          raw=open('/tmp/state.json','rb').read()
          packed={
            "encoding":"gzip-base64",
            "data":base64.b64encode(gzip.compress(raw,9)).decode(),
            "format":"connect-club-state-v1"
          }
          open('/tmp/packed.json','w',encoding='utf-8').write(json.dumps(packed,separators=(',',':')))
          print("Raw bytes:",len(raw),"Packed bytes:",len(open('/tmp/packed.json','rb').read()))
          PY
          test $(wc -c < /tmp/packed.json) -lt 64000

          NS="connect-club-$(python -c "import uuid; print(uuid.uuid4().hex)")"
          REMOTE="https://mantledb.sh/v2/$NS/state"
          CODE=$(curl -sS -o /tmp/write.json -w "%{http_code}" -X POST "$REMOTE" -H "Content-Type: application/json" --data-binary @/tmp/packed.json)
          echo "Mantle write status: $CODE"
          cat /tmp/write.json
          test "$CODE" = "200"

          curl -fsS -H "Origin: https://luanmaluf.github.io" "$REMOTE" -o /tmp/readback.json
          python - <<'PY'
          import gzip,base64,json
          p=json.load(open('/tmp/readback.json'))
          d=json.loads(gzip.decompress(base64.b64decode(p['data'])))
          assert d['settings']['eventName']=='CONNECT CLUB'
          assert len(d['expenses']) > 100
          print("Verified shared state:",len(d['expenses']),"items")
          PY

          cat > shared-config.js <<EOF
          // CONNECT CLUB — workspace compartilhado automático
          window.CONNECT_CLUB_REMOTE_URL="$REMOTE";

          (function(){
            const sharedUrl = window.CONNECT_CLUB_REMOTE_URL;
            const originalFetch = window.fetch.bind(window);

            function bytesToBase64(bytes) {
              let out = '';
              const step = 0x8000;
              for (let i = 0; i < bytes.length; i += step) {
                out += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + step, bytes.length)));
              }
              return btoa(out);
            }

            function base64ToBytes(text) {
              const bin = atob(text);
              const out = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
              return out;
            }

            async function gzipText(text) {
              const stream = new Blob([new TextEncoder().encode(text)]).stream().pipeThrough(new CompressionStream('gzip'));
              const buf = await new Response(stream).arrayBuffer();
              return bytesToBase64(new Uint8Array(buf));
            }

            async function gunzipText(b64) {
              const bytes = base64ToBytes(b64);
              const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
              return await new Response(stream).text();
            }

            window.fetch = async function(input, init) {
              const url = typeof input === 'string' ? input : input.url;
              if (url !== sharedUrl) return originalFetch(input, init);

              const method = String((init && init.method) || 'GET').toUpperCase();

              if (method === 'GET') {
                const r = await originalFetch(sharedUrl + '?t=' + Date.now(), {cache:'no-store'});
                if (!r.ok) return r;
                const packed = await r.json();
                if (!packed || packed.encoding !== 'gzip-base64' || !packed.data) {
                  return new Response(JSON.stringify(packed), {status:200,headers:{'Content-Type':'application/json'}});
                }
                const jsonText = await gunzipText(packed.data);
                return new Response(jsonText, {status:200,headers:{'Content-Type':'application/json','Cache-Control':'no-store'}});
              }

              if (method === 'PUT') {
                const body = typeof init.body === 'string' ? init.body : await new Response(init.body).text();
                const data = await gzipText(body);
                const packed = JSON.stringify({encoding:'gzip-base64',data,format:'connect-club-state-v1',updatedAt:new Date().toISOString()});
                return originalFetch(sharedUrl, {
                  method:'POST',
                  headers:{'Content-Type':'application/json'},
                  body:packed
                });
              }

              return originalFetch(input, init);
            };

            try {
              const u = new URL(window.location.href);
              if (!u.searchParams.get('db')) {
                u.searchParams.set('db', sharedUrl);
                history.replaceState(null, '', u.toString());
              }
            } catch (e) { console.error(e); }
          })();
          EOF

          git config user.name "connect-club-bot"
          git config user.email "actions@users.noreply.github.com"
          git add shared-config.js
          git commit -m "Ativa workspace MantleDB compartilhado"
          git push
