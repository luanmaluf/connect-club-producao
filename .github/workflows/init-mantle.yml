name: Initialize MantleDB Workspace

on:
  push:
    paths:
      - ".github/workflows/init-mantle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize shared workspace
        shell: bash
        run: |
          if [ -f shared-config.js ] && grep -q "mantledb.sh/v2/" shared-config.js; then
            echo "Mantle workspace already configured."
            exit 0
          fi

          awk '/^let state=defaultState/{exit} {print}' app1.js > /tmp/seed-part.js
          cat >> /tmp/seed-part.js <<'NODE'
          const s = defaultState();
          s.activity = [{id:uid(),at:today(),by:"Sistema",action:"Workspace criado",detail:"Base compartilhada oficial do CONNECT CLUB criada automaticamente."}];
          console.log(JSON.stringify(s));
          NODE
          node /tmp/seed-part.js > /tmp/state.json
          BYTES=$(wc -c < /tmp/state.json)
          echo "State size: $BYTES bytes"
          test "$BYTES" -lt 64000

          NS="connect-club-$(python -c "import uuid; print(uuid.uuid4().hex)")"
          REMOTE="https://mantledb.sh/v2/$NS/state"
          CODE=$(curl -sS -o /tmp/write.json -w "%{http_code}" -X POST "$REMOTE" -H "Content-Type: application/json" --data-binary @/tmp/state.json)
          echo "Mantle write status: $CODE"
          cat /tmp/write.json
          test "$CODE" = "200"

          curl -fsS -H "Origin: https://luanmaluf.github.io" "$REMOTE" -o /tmp/readback.json
          node -e "const d=require('/tmp/readback.json'); if(d.settings.eventName!=='CONNECT CLUB'||d.expenses.length<100) process.exit(1); console.log('Verified shared state',d.expenses.length)"

          cat > shared-config.js <<EOF
          // CONNECT CLUB — workspace compartilhado automático
          window.CONNECT_CLUB_REMOTE_URL="$REMOTE";

          (function(){
            const originalFetch = window.fetch.bind(window);
            window.fetch = function(input, init) {
              try {
                const url = typeof input === 'string' ? input : input.url;
                if (url && url.indexOf('https://mantledb.sh/v2/') === 0 && init && String(init.method || 'GET').toUpperCase() === 'PUT') {
                  init = Object.assign({}, init, {method:'POST'});
                }
              } catch (e) {}
              return originalFetch(input, init);
            };

            try {
              const u = new URL(window.location.href);
              if (!u.searchParams.get('db')) {
                u.searchParams.set('db', window.CONNECT_CLUB_REMOTE_URL);
                history.replaceState(null, '', u.toString());
              }
            } catch (e) { console.error(e); }
          })();
          EOF

          git config user.name "connect-club-bot"
          git config user.email "actions@users.noreply.github.com"
          git add shared-config.js
          git commit -m "Ativa workspace MantleDB compartilhado"
          git push
